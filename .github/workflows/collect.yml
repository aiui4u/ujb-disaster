name: 재난자료 자동 수집

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: disaster-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 파일 가져오기
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 재난자료 수집
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          AIRKOREA_API_KEY: ${{ secrets.AIRKOREA_API_KEY }}
          SAFETYDATA_MESSAGES_KEY: ${{ secrets.SAFETYDATA_MESSAGES_KEY }}
          SAFETYDATA_WATER_KEY: ${{ secrets.SAFETYDATA_WATER_KEY }}
          SAFETYDATA_RAIN_KEY: ${{ secrets.SAFETYDATA_RAIN_KEY }}
          SAFETYDATA_FIRE_KEY: ${{ secrets.SAFETYDATA_FIRE_KEY }}
          SAFETYDATA_LANDSLIDE_KEY: ${{ secrets.SAFETYDATA_LANDSLIDE_KEY }}
          SAFETYDATA_PREDICTION_KEY: ${{ secrets.SAFETYDATA_PREDICTION_KEY }}
          SAFETYDATA_POP_KEY: ${{ secrets.SAFETYDATA_POP_KEY }}
          SAFETYDATA_RAIN6_KEY: ${{ secrets.SAFETYDATA_RAIN6_KEY }}
        run: node collector/collect.mjs

      - name: 갱신된 JSON 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json

          if git diff --cached --quiet; then
            echo "저장할 변경 없음"
          else
            git commit -m "data: refresh disaster information"
            git pull --rebase origin main
            git push origin main
          fi

      - name: 사이트 게시 실행
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
